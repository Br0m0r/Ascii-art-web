<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Web</title>
    <style>
        body {
            background-color: #000;
            color: #b700ff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(42,0,66,0.7) 100%);
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: #b700ff;
            text-shadow: 0 0 10px #b700ff, 
                         0 0 20px #b700ff,
                         0 0 30px #b700ff;
            animation: glow 1.5s ease-in-out infinite alternate;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            background-color: rgba(42, 0, 66, 0.3);
            border: 1px solid #b700ff;
            color: #b700ff;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            margin: 20px 0;
            box-shadow: 0 0 15px rgba(183, 0, 255, 0.4);
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #b700ff;
            box-shadow: 0 0 25px rgba(183, 0, 255, 0.6);
            background-color: rgba(42, 0, 66, 0.5);
        }

        .banner-options {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #b700ff;
            background-color: rgba(42, 0, 66, 0.3);
            box-shadow: 0 0 15px rgba(183, 0, 255, 0.4);
        }

        .banner-options label {
            margin: 0 15px;
            cursor: pointer;
            position: relative;
            padding-left: 25px;
            text-shadow: 0 0 5px #b700ff;
        }

        .banner-options input[type="radio"] {
            opacity: 0;
            position: absolute;
        }

        .banner-options label::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 1px solid #b700ff;
            border-radius: 50%;
            background-color: transparent;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(183, 0, 255, 0.4);
        }

        .banner-options input[type="radio"]:checked + label::before {
            background-color: #b700ff;
            box-shadow: 0 0 15px #b700ff;
        }

        .button-container {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background-color: transparent;
            color: #b700ff;
            border: 1px solid #b700ff;
            padding: 12px 24px;
            margin: 0 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 5px #b700ff;
            box-shadow: 0 0 10px rgba(183, 0, 255, 0.4);
        }

        button:hover {
            background-color: rgba(183, 0, 255, 0.1);
            box-shadow: 0 0 20px #b700ff;
            text-shadow: 0 0 10px #b700ff;
        }

        button::before {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                transparent,
                rgba(183, 0, 255, 0.2),
                transparent
            );
            animation: scan 2s linear infinite;
        }

        #output {
            background-color: rgba(42, 0, 66, 0.3);
            border: 1px solid #b700ff;
            padding: 20px;
            margin-top: 20px;
            white-space: pre;
            overflow-x: auto;
            font-family: monospace;
            position: relative;
            box-shadow: 0 0 15px rgba(183, 0, 255, 0.4);
            text-shadow: 0 0 3px #b700ff;
            color: #b700ff;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #b700ff, 
                            0 0 20px #b700ff;
            }
            to {
                text-shadow: 0 0 20px #b700ff, 
                            0 0 30px #b700ff,
                            0 0 40px #b700ff;
            }
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(200%);
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Error {{.Code}}</h1>
        <div class="error-message">{{.Message}}</div>
        <a href="/" class="back-button">Return to Home</a>
    </div>
</body>
</html>
